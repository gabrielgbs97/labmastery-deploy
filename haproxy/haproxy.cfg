# LabMastery — HAProxy (configuración ESTÁTICA).
#
# Qué es estático y qué es dinámico (D23, 08-despliegue.md §4.3):
#   - ESTÁTICO (este fichero): frontends, listeners, terminación TLS, backends
#     base. Cambia por commit → tiene historial y revisión de código.
#   - DINÁMICO (en runtime): las rutas de los labs, que añade el orquestador
#     vía la Data Plane API (haproxy.dataplane.*).
#
# La Data Plane API NO puede definir frontends, listeners ni TLS: por eso el
# reparto es estructural, no arbitrario.
#
# El usuario `labadmin` es el que usa la Data Plane API (basic auth). Su
# contraseña va hasheada (SHA-512 crypt) y la genera el gestor de secretos del
# despliegue (D23 §7); aquí va el marcador de posición.

global
    log stdout format raw local0 info
    maxconn 4096
    # Socket de administración: la usa el sidecar de la Data Plane API para
    # aplicar los cambios y consultar el estado en runtime.
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

# Credenciales de la Data Plane API. El hash lo sustituye el despliegue.
userlist admins
    user labadmin password PLACEHOLDER_SHA512_HASH

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 10s
    timeout client  60s
    timeout server  60s
    # Rutas de labs: sesiones largas (terminal, escritorio).
    timeout tunnel  1h

# --- Frontend HTTP (redirección a HTTPS) ------------------------------------
frontend fe_http
    bind *:80
    http-request redirect scheme https code 301 if !{ ssl_fc }

# --- Frontend HTTPS (punto de entrada único) ---------------------------------
frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/labmastery.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    http-request set-header X-Real-IP %[src]
    # Cabeceras de seguridad (el servicio también las pone).
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options SAMEORIGIN

    # Portal público.
    acl is_web path_beg /api/ /labs/ /assets/
    use_backend be_web if is_web
    default_backend be_console

# --- Backends base -----------------------------------------------------------
backend be_web
    balance roundrobin
    option httpchk GET /health
    server web web:3000 check inter 10s fall 3 rise 2

backend be_console
    balance roundrobin
    option httpchk GET /api/health
    server console console:4100 check inter 10s fall 3 rise 2

# --- Rutas dinámicas de los labs ---------------------------------------------
# El orquestador las crea en runtime por la Data Plane API. Este bloque sólo
# documenta el convenio; las entradas reales las añade el API:
#
#   backend be_lab_<id>
#       server lab-<id> <ip>:<port>
#
# y en el frontend fe_https:
#
#   acl host_<host> hdr(host)
#   use_backend be_lab_<id> if host_<host>
#
# El orquestador necesita un usuario con permisos de administracion de
# HAProxy (el `userlist admins` de arriba) y la credencial vive en
# `orch.settings` como `haproxy.dataplane.password` (referencia a Vault).