# LabMastery — inventario.
#
# Un solo host por defecto (el sistema son 6 componentes y una maquina).
# Para mas hosts, duplica el grupo y ajusta los roles.

[labmastery]
labmastery-01 ansible_host=labmastery-01.labmastery.local ansible_connection=local

[labmastery:vars]
# Donde vive el repo de despliegue en el host.
deploy_root=/opt/labmastery
# Donde estan los repos de servicio (el compose los monta en modo dev).
repos_root=/opt/labmastery/repos
